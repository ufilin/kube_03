apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
          app: my-app
    spec:
      containers:
        - name: web
          image: nginx:1.14.2
        - name: tool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"